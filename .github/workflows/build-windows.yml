name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target ExecutorGUI TestHost CoreTests --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/ExecutorLab | Out-Null
          Copy-Item build/bin/Release/ExecutorGUI.exe dist/ExecutorLab/
          Copy-Item build/bin/Release/TestHost.exe dist/ExecutorLab/
          Copy-Item build/bin/Release/ExecutorCore.dll dist/ExecutorLab/
          Copy-Item README.md dist/ExecutorLab/
          Compress-Archive -Path dist/ExecutorLab -DestinationPath dist/ExecutorLab-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ExecutorLab-Windows-x64
          path: dist/ExecutorLab-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error
